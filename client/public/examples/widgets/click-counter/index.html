<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click Counter — OpenBento Sample Widget</title>
  <script src="/sdk/widget-sdk.v1.js"></script>
  <style>
    :root { --bg: #0f172a; --fg: #e2e8f0; --accent: #22d3ee; --muted: #64748b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 16px; transition: background 200ms, color 200ms;
    }
    .label { font-size: 11px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
    .count { font-size: clamp(40px, 18vw, 96px); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
    .row   { display: flex; gap: 8px; }
    button {
      background: rgba(255,255,255,0.06); color: var(--fg);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.12); }
    button.primary { background: var(--accent); color: #0f172a; border-color: transparent; }
  </style>
</head>
<body>
  <div class="label">Clicks</div>
  <div class="count" id="count">0</div>
  <div class="row">
    <button id="inc" class="primary" type="button">+1</button>
    <button id="reset" type="button">Reset</button>
  </div>

  <script>
    (function () {
      var count = 0;
      var $count = document.getElementById('count');

      function render() { $count.textContent = String(count); }
      function persist() {
        OpenBento.setState({ count: count }).catch(function () {});
      }

      document.getElementById('inc').addEventListener('click', function () {
        count += 1; render(); persist();
      });
      document.getElementById('reset').addEventListener('click', function () {
        count = 0; render(); persist();
      });

      OpenBento.onTheme(function (t) {
        document.documentElement.style.setProperty('--bg',     t.bg || (t.dark ? '#0f172a' : '#f8fafc'));
        document.documentElement.style.setProperty('--fg',     t.dark ? '#e2e8f0' : '#0f172a');
        document.documentElement.style.setProperty('--accent', t.accent || '#22d3ee');
      });

      OpenBento.ready({ name: 'Click Counter', version: '1.0.0' });
      OpenBento.getState().then(function (saved) {
        if (saved && typeof saved.count === 'number') count = saved.count;
        render();
      }).catch(function () { render(); });

      render();
    })();
  </script>
</body>
</html>
