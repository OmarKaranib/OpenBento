name: Test OpenBento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://openbento:openbento@localhost:5432/openbento_test
      TEST_DATABASE_URL: postgresql://openbento:openbento@localhost:5432/openbento_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openbento
          POSTGRES_PASSWORD: openbento
          POSTGRES_DB: openbento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbento -d openbento_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database tables
        run: npm run db:push

      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build
